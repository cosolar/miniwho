name: 功能建议
description: 想要的新能力、模板、或使用体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前建议先读一遍 README 的「适合谁 / 不适合谁」——这个项目刻意做小，功能取舍比功能数量更重要。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的实际问题
      description: 描述场景，而不是先给方案。比如「导出前想确认分页位置，现在只能导完再看」
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的解决方式

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 简历编辑 / 工作台
        - 模板与模板包
        - 预览 / 打印 / PDF 导出
        - 分享与隐私
        - 账号与后台
        - 部署与运维
        - 文档
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你现在的替代做法
      description: 有助于判断这个需求有多痛

  - type: checkboxes
    id: contribution
    attributes:
      label: 你能参与吗
      options:
        - label: 我可以提 PR
        - label: 我可以提供设计稿 / 模板包
        - label: 我只能描述需求
