# ------------------------------------------------------------------
# MiniWho / 极简简历 · Docker Compose
# 应用镜像同时包含前端页面与后端 API（前端产物打进 jar），
# MySQL 仍是独立服务。复制 .env.example 为 .env 后按需修改，再执行：
#   docker compose up -d --build
# ------------------------------------------------------------------
services:
  mysql:
    image: mysql:8.4
    container_name: miniwho-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-miniwho_root}
      MYSQL_DATABASE: ${DB_NAME:-miniwho}
      MYSQL_USER: ${DB_USER:-miniwho}
      MYSQL_PASSWORD: ${DB_PASSWORD:-miniwho_pass}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: miniwho:latest
    container_name: miniwho
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-miniwho}
      DB_USER: ${DB_USER:-miniwho}
      DB_PASSWORD: ${DB_PASSWORD:-miniwho_pass}
      MINIWHO_UPLOAD_DIR: /app/uploads
      MINIWHO_SEED_DEMO: ${MINIWHO_SEED_DEMO:-true}
      MINIWHO_DEMO_PASSWORD: ${MINIWHO_DEMO_PASSWORD:-demo123}
      # 管理员密码必填：缺失时 compose 直接报错，不给你一个 admin/admin123 的公网后台
      MINIWHO_ADMIN_PASSWORD: ${MINIWHO_ADMIN_PASSWORD:?请在 .env 里设置 MINIWHO_ADMIN_PASSWORD}
      MINIWHO_CORS_ORIGINS: ${MINIWHO_CORS_ORIGINS:-*}
      # 媒体链接签名密钥：留空则每次启动随机生成（重启后旧的头像链接失效）
      MINIWHO_MEDIA_SECRET: ${MINIWHO_MEDIA_SECRET:-}
      # 服务端 PDF：镜像内带 chromium，页面与 API 同属一个容器，直接指向自己
      MINIWHO_PDF_ENABLED: ${MINIWHO_PDF_ENABLED:-true}
      MINIWHO_PDF_RENDER_BASE_URL: ${MINIWHO_PDF_RENDER_BASE_URL:-http://127.0.0.1:8080}
      MINIWHO_PDF_MAX_CONCURRENT: ${MINIWHO_PDF_MAX_CONCURRENT:-2}
      MINIWHO_PDF_QUEUE_TIMEOUT: ${MINIWHO_PDF_QUEUE_TIMEOUT:-20}
      # 注册 / 登录方式：留空即关闭对应通道，开关本身在管理后台「认证设置」里
      MINIWHO_PUBLIC_BASE_URL: ${MINIWHO_PUBLIC_BASE_URL:-}
      MINIWHO_MAIL_HOST: ${MINIWHO_MAIL_HOST:-}
      MINIWHO_MAIL_PORT: ${MINIWHO_MAIL_PORT:-465}
      MINIWHO_MAIL_USERNAME: ${MINIWHO_MAIL_USERNAME:-}
      MINIWHO_MAIL_PASSWORD: ${MINIWHO_MAIL_PASSWORD:-}
      MINIWHO_MAIL_FROM: ${MINIWHO_MAIL_FROM:-}
      MINIWHO_MAIL_FROM_NAME: ${MINIWHO_MAIL_FROM_NAME:-极简简历}
      MINIWHO_MAIL_SSL: ${MINIWHO_MAIL_SSL:-true}
      MINIWHO_MAIL_STARTTLS: ${MINIWHO_MAIL_STARTTLS:-false}
      MINIWHO_GITHUB_CLIENT_ID: ${MINIWHO_GITHUB_CLIENT_ID:-}
      MINIWHO_GITHUB_CLIENT_SECRET: ${MINIWHO_GITHUB_CLIENT_SECRET:-}
      TZ: Asia/Shanghai
    shm_size: "512mb"
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  mysql-data:
  uploads:
