server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
  error:
    include-message: never

spring:
  application:
    name: miniwho
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:sqlite:${MINIWHO_DB:./miniwho.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 5
      max-wait: 5000
      # SQLite 没有系统表探活，用 SELECT 1 做空闲校验即可
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      filters: stat
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: false
      stat-view-servlet:
        # Druid 监控页涉及 SQL 与连接信息，默认关闭，需要时用环境变量显式打开并设置账号
        enabled: ${MINIWHO_DRUID_STAT:false}
        login-username: ${MINIWHO_DRUID_USER:druid}
        login-password: ${MINIWHO_DRUID_PASSWORD:}
  cache:
    type: caffeine
    cache-names: template-active,template-detail
    caffeine:
      # 模板数据变化不频繁：写入 5 分钟过期 + 上限 200 条，写操作会主动清缓存
      spec: maximumSize=200,expireAfterWrite=300s
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-sqlite.sql
      continue-on-error: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  web:
    resources:
      # 前端产物打进 jar 的 static/ 之后，静态映射统一由 StaticSiteConfig 接管：
      # 它要负责 SPA 回落（/dashboard 返回 index.html），默认映射会和它抢同一个 /** 模式。
      add-mappings: false

springdoc:
  api-docs:
    # 默认关：接口清单不该匿名暴露在公网；本地调试时设 MINIWHO_OPENAPI_ENABLED=true。
    enabled: ${MINIWHO_OPENAPI_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: cn.minims.who.controller
  paths-to-match: /api/**

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

sa-token:
  token-name: satoken
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-print: false

app:
  upload-dir: ${MINIWHO_UPLOAD_DIR:./uploads}
  cors-origins: ${MINIWHO_CORS_ORIGINS:*}
  media-secret: ${MINIWHO_MEDIA_SECRET:}
  # 站点对外地址：GitHub 的回调地址、以及第三方登录完成后把浏览器送回哪个前端，都从它拼出来。
  # 留空时 GitHub 功能视为未配置，后台会给出提示。
  public-base-url: ${MINIWHO_PUBLIC_BASE_URL:}
  mail:
    # 只支持标准 SMTP，不接第三方发信服务。host 留空即视为未配置，邮箱注册不会被开放。
    host: ${MINIWHO_MAIL_HOST:}
    port: ${MINIWHO_MAIL_PORT:465}
    username: ${MINIWHO_MAIL_USERNAME:}
    # QQ / 163 这类个人邮箱要填的是「授权码」，不是邮箱登录密码
    password: ${MINIWHO_MAIL_PASSWORD:}
    from: ${MINIWHO_MAIL_FROM:}
    from-name: ${MINIWHO_MAIL_FROM_NAME:极简简历}
    # 465 用隐式 SSL；587 之类改成 ssl=false + starttls=true
    ssl: ${MINIWHO_MAIL_SSL:true}
    starttls: ${MINIWHO_MAIL_STARTTLS:false}
  oauth:
    github:
      client-id: ${MINIWHO_GITHUB_CLIENT_ID:}
      client-secret: ${MINIWHO_GITHUB_CLIENT_SECRET:}
  pdf:
    enabled: ${MINIWHO_PDF_ENABLED:true}
    browser-path: ${MINIWHO_PDF_BROWSER_PATH:}
    render-base-url: ${MINIWHO_PDF_RENDER_BASE_URL:http://127.0.0.1:5173}
    timeout-seconds: ${MINIWHO_PDF_TIMEOUT:45}
    # 同时运行的 Chromium 实例上限与排队等待秒数：宁可让请求排队/快速失败，也不让并发实例把内存吃光。
    max-concurrent: ${MINIWHO_PDF_MAX_CONCURRENT:2}
    queue-timeout-seconds: ${MINIWHO_PDF_QUEUE_TIMEOUT:20}
  seed-demo: ${MINIWHO_SEED_DEMO:true}
  demo-password: ${MINIWHO_DEMO_PASSWORD:demo123}
  # 管理员密码没有默认值：首次启动（库里还没有 admin 账号）时未设置会直接拒绝启动
  admin-password: ${MINIWHO_ADMIN_PASSWORD:}

logging:
  level:
    root: info
    cn.minims.who: info
    com.baomidou: warn
