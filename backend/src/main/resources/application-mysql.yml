server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:miniwho}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 20
      max-wait: 5000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      filters: stat
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: false
      stat-view-servlet:
        enabled: ${MINIWHO_DRUID_STAT:false}
        login-username: ${MINIWHO_DRUID_USER:druid}
        login-password: ${MINIWHO_DRUID_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-mysql.sql
